[project]
name = "lovable-audit"
version = "0.1.0"
description = "Black-box security scanner for apps built with Lovable"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "dnspython>=2.6",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "anthropic>=0.40"]

[project.scripts]
lovable-audit = "lovable_audit.cli:main"
lovable-audit-serve = "lovable_audit.serve:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lovable_audit*"]

[tool.setuptools.package-data]
lovable_audit = ["templates/*.j2"]
